[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-emotion-validity"
version = "1.0.0"
description = "Subject, stimulus, and signal controls for evaluating EEG emotion recognition benchmarks (DEAP, DREAMER, SEED-IV)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "xlrd>=2.0",
]

[project.optional-dependencies]
deep = [
  "torch>=2.1",
  "braindecode>=1.0",
  "torcheeg>=1.1",
]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"